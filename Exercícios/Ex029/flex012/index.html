<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.conteiner01 {
            background-color: lightsalmon;
            display: flex;

            flex-flow: row nowrap;
            
        }

        div.item01 {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            
        }

        div#cxA {
            /*flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 200px;*/

            flex: 0 1 200px;
        }

        div#cxB {
            /*flex-grow: 1;
            flex-shrink: 1;
            flex-basis: 150px;*/

            flex: 1 1 150px;
        }

        div#cxC {
            /*flex-grow: 1;
            flex-shrink: 8;
            flex-basis: auto;*/

            flex: 1 8 auto;
        }
        
    </style>
</head>
<body>
    <div class="conteiner01">
        <div class="item01" id="cxA">A</div>
        <div class="item01" id="cxB">B</div>
        <div class="item01" id="cxC">C</div>
    </div>
</body>
</html>
