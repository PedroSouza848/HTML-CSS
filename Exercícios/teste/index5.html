<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajax</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="container">
    <h1>API de Testes httpbin</h1>
    <form class="form m-2">
        <p>
            <label class="form-label" for="in1">Nome: </label>
            <input class="form-control" type="text" id="in1">
        </p>
        <a class="btn btn-primary m-2" href="#" onclick="executar()">Executar</a>
    </form>
    <div class="alert alert-warning" id="retorno"></div>
    <script src="Ajax.js"></script>
    <script>
        const executar = () => {
            const nome = document.getElementById("in1").value;
            ajax(nome,"retorno");
        }
    </script>
</body>
</html>
