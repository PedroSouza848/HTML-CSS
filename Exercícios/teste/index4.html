<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetores</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="container">
    <h1>Vetores no Google Charts</h1>
    <form class="form m-2">
        <p>
            <label class="form-label" for="iv1">Valor de X:</label>
            <input class="form-control" type="number" name="v1" id="iv1">
        </p>
        <a class="btn btn-primary m-2" href="#" onclick="executar()">Executar</a>
    </form>
    <div id="chart_div"></div>
    <div class="alert alert-warning" id="media"></div>

    <script src="vetor.js"></script>
    <script>
        const executar = () => {
            const x = eval(document.getElementById("iv1").value);
            addValor(x);
            google.charts.load('current', {packages: ['corechart','line']});
            google.charts.setOnLoadCallback(drawBasic);
            document.getElementById("media").innerHTML = `Media: ${media()}`;
        }
    </script>
</body>
</html>
