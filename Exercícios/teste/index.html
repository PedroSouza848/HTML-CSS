<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        form {
            text-align: center;
            margin-top: 80px;
        }

        div#resp {
            text-align: center;
        }
    </style>
</head>
<body>
    <form action="" method="get">
        <p>
            <label for="iv1">Valor 01: </label>
            <input type="number" name="v1" id="iv1">
        </p>
        
        <p>
            <label for="iv2">Valor 02: </label>
            <input type="number" name="v2" id="iv2">
        </p>

        <p>
            <label for="oper">Operação</label>
            <select name="seletor" id="oper">
                <option value="Soma">Soma</option>
                <option value="Subtração">Subtração</option>
                <option value="Multiplicação">Multiplicação</option>
                <option value="Divisão">Divisão</option>
                <option value="Potência">Potência</option>
            </select>
        </p>

        <a href="#" onclick="executar()" >Executar</a>
    </form>
    <div id="resp">O resultado é </div> 
    <script src="arquivo.js"></script>
    <script>
        const executar = () => {
            const a = eval(document.getElementById("iv1").value);
            const b = eval(document.getElementById("iv2").value);
            let oper = eval(document.getElementById("oper").selectedIndex);
            let resultado = (oper==0)?somar(a,b):(oper==1)?subtrair(a,b):(oper==2)?multiplicar(a,b):(oper==3)?dividir(a,b):exponencial(a,b);
            document.getElementById("resp").innerHTML = `O resultado é  ${resultado}`;
        }
    </script>
</body>
</html>
