<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="container">
    <form class="form m-2" action="" method="get">
        <p>
            <label class="form-label" for="iv1">Valor 01: </label>
            <input class="form-control" type="number" name="v1" id="iv1">
        </p>
        
        <p>
            <label class="form-label" for="iv2">Valor 02: </label>
            <input class="form-control" type="number" name="v2" id="iv2">
        </p>

        <p>
            <label class="form-label" for="oper">Operação</label>
            <select class="form-select" name="seletor" id="oper">
                <option value="Soma">Soma</option>
                <option value="Subtração">Subtração</option>
                <option value="Multiplicação">Multiplicação</option>
                <option value="Divisão">Divisão</option>
                <option value="Potência">Potência</option>
            </select>
        </p>

        <a class="btn btn-primary m-2" href="#" onclick="executar()" >Executar</a>
    </form>
    <div class="alert alert-success" id="resp">O resultado é </div> 
    <script src="arquivo.js"></script>
    <script>
        const executar = () => {
            const a = eval(document.getElementById("iv1").value);
            const b = eval(document.getElementById("iv2").value);
            let oper = eval(document.getElementById("oper").selectedIndex);
            let resultado = (oper==0)?somar(a,b):(oper==1)?subtrair(a,b):(oper==2)?multiplicar(a,b):(oper==3)?dividir(a,b):exponencial(a,b);
            document.getElementById("resp").innerHTML = `O resultado é  ${resultado}`;
        }
    </script>
</body>
</html>
