<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de formulário</title>
</head>
<body>
    <h1>Mais controles de formulários</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome: </label>
                <input type="text" name="nome" id="inome" required minlength="5" maxlength="20">
            </p>
            <p>
                <label for="iemail">Email: </label>
                <input type="email" name="email" id="iemail" required autocomplete="email">
            </p>
            <p>
                <label for="ifone">Telefone: </label>
                <input type="tel" name="fone" id="ifone" required autocomplete="tel" pattern="^\d{4,5}-\d{4}$" placeholder="xxxxx-xxxx">
            </p>
        </fieldset>
        <fieldset>
            <legend>Dados adicionais</legend>
            <p>
                <label for="ifruta">Fruta favorita: </label>
                <input type="text" name="Fruta" id="ifruta" required>
            </p>
            <p>
                <label for="icor">Cor favorita: </label>
                <input type="text" name="Cor" id="icor" required>
            </p>
            <p>
                <label for="iserie">Serie favorita: </label>
                <input type="text" name="Serie" id="iserie" required>
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
