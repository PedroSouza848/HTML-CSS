<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escala de coletas</title>
    <style>
        table {
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            width: 280px;
        }

        thead {
            margin: auto;
        }

        tr, td {
            border: 1px solid black;
        } 

        .gedilson {
            background-color: green;
            color: white;
            text-align: center;
            font-weight: bold;
        }

        .carroca {
            background-color: yellow;
            color: black;
            text-align: center;
            font-weight: bold;
        }

        .recicoop {
            background-color: rgb(45, 168, 244);
            color: black;
            text-align: center;
            font-weight: bold;
        }

        .luiz {
            background-color: rgb(126, 72, 5);
            color: black;
            text-align: center;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <table>
        <thead>
            <th style="text-align: center;">Escala Para Coletas de Avarias</th>
        </thead>
        <tbody>
            <tr class="gedilson">
                <td>Segunda/Terça</td>
                <td>Gedilson</td>
            </tr>
            <tr class="carroca">
                <td>Quarta</td>
                <td>Carroceiro</td>
            </tr>
            <tr class="recicoop">
                <td>Quinta/Sexta</td>
                <td>Recicoop</td>
            </tr>
            <tr class="luiz">
                <td>Sábado/Domingo</td>
                <td>Luiz</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
